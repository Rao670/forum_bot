name: Forum Bot Automation

on:
  schedule:
    - cron:  '0 0 * * *'  
  workflow_dispatch: # Manual chalane ke liye

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Create credentials.json
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run Bot
        env:
          EA_EMAIL: ${{ secrets.EA_EMAIL }}
          EA_PASSWORD: ${{ secrets.EA_PASSWORD }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          URL_ACCOUNTS_JSON: ${{ secrets.URL_ACCOUNTS_JSON }}
        run: python test_huggingface.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add bot_data.db bubble_reply_history.txt gsheet_logs.tsv reply_history.txt
          git commit -m "Update bot data and logs [skip ci]" || echo "No changes to commit"
          git push
